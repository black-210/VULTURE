[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "vulture"
version = "3.0.0"
description = "VULTURE — receive-only RF analysis, fingerprinting, forensics and physics toolkit"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
dependencies = [
    "click>=8.1",
    "numpy>=1.21",
]

[project.optional-dependencies]
science = [
    "scipy>=1.7",
    "pandas>=1.3",
    "matplotlib>=3.4",
]
ml = [
    "scikit-learn>=1.0",
    "onnx>=1.12",
    "onnxruntime>=1.13",
]
gui = ["PyQt6>=6.2"]
security = [
    "cryptography>=38.0",
    "requests>=2.28",
    "PyYAML>=6.0",
    "pydantic>=1.9",
]
dev = [
    "pytest>=7",
    "pytest-cov>=4",
    "ruff>=0.6",
]

[project.scripts]
vulture = "vulture.cli:cli"
vulture-chemical-rf = "vulture.chemical_rf.cli:chemical_rf_cli"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "hardware: tests requiring explicitly configured laboratory hardware",
]
filterwarnings = [
    "error",
    "ignore:.*distutils.*:DeprecationWarning",
]

[tool.ruff]
target-version = "py310"
line-length = 100
extend-exclude = ["examples"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
