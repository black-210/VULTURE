[build-system]
requires = ["setuptools>=65.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vulture-platform"
version = "0.1.0"
description = "Production-grade AI-powered Intelligence, Research, Engineering & Automation Platform"
readme = "README.md"
requires-python = ">=3.9"
license = {text = "Apache-2.0"}
authors = [{name = "BLACK Cyber Falcon", email = "dev@vulture.ai"}]
keywords = [
    "RF",
    "SDR",
    "DSP",
    "Signal Processing",
    "AI",
    "ML",
    "Deep Learning",
    "Research",
    "Engineering",
    "Cybersecurity",
    "Medical Research",
    "Scientific Computing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "Topic :: Scientific/Engineering",
    "Topic :: Software Development :: Libraries",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

[project.urls]
Repository = "https://github.com/black-cyber-falcon/VULTURE"
Documentation = "https://vulture.readthedocs.io"
BugTracker = "https://github.com/black-cyber-falcon/VULTURE/issues"

[project.optional-dependencies]
gpu = ["torch[cuda]", "cupy"]
medical = ["pydicom", "nibabel"]
bio = ["biopython"]
dev = [
    "pytest>=7.0",
    "pytest-cov>=3.0",
    "black>=22.0",
    "isort>=5.0",
    "flake8>=4.0",
    "mypy>=0.950",
    "sphinx>=4.0",
    "sphinx-rtd-theme>=1.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.black]
line-length = 100
target-version = ['py39']

[tool.isort]
profile = "black"
line_length = 100

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = false

[tool.pytest.ini_options]
minversion = "7.0"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short --strict-markers"
markers = [
    "slow: marks tests as slow",
    "integration: marks tests as integration tests",
    "unit: marks tests as unit tests",
    "gpu: marks tests requiring GPU",
    "network: marks tests requiring network access",
]
